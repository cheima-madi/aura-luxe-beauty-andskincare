
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Luxe | Premium Beauty & Skincare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --aura-dark: #0A0A0A;
        --aura-rose: #E5C1CD;
        --aura-pearl: #FCF8F7;
        --aura-gold: #D4AF37;
      }
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: var(--aura-pearl);
        color: var(--aura-dark);
      }
      h1, h2, h3, .luxury-font { font-family: 'Playfair Display', serif; }
      
      /* Custom luxury scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--aura-pearl); }
      ::-webkit-scrollbar-thumb { background: var(--aura-dark); border-radius: 10px; }

      .bg-aura-dark { background-color: var(--aura-dark); }
      .text-aura-rose { color: var(--aura-rose); }
      .border-aura-rose { border-color: var(--aura-rose); }
      .bg-aura-rose { background-color: var(--aura-rose); }
    </style>
